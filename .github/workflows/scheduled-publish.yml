name: Scheduled publish
# בודק כל 5 דקות אם הגיע זמן של פרסום מתוזמן (schedule.json ב-guyaros/3d-news). ראו scheduler.js.
# נמצא כאן ולא ב-repo הפרטי כי ב-repo ציבורי דקות Actions לא נספרות במכסה.

on:
  schedule:
    - cron: "2-59/5 * * * *"   # לא בדיוק על :00 - שם GitHub הכי עמוס ומעכב
  workflow_dispatch: {}

concurrency:
  group: scheduled-publish
  cancel-in-progress: false

permissions:
  contents: write   # רק בשביל ה-keepalive למטה

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: node scheduler.js
        env:
          SCHED_TOKEN: ${{ secrets.SCHED_TOKEN }}
      # GitHub משבית workflows מתוזמנים ב-repo ציבורי אחרי 60 יום בלי commits. commit ריק כל 50 יום מונע את זה.
      - name: keepalive
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive (scheduled publish)"
            git push
          fi
